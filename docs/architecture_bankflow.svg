<text x="563.0" y="478" font-size="11.5" font-weight="400" fill="#333" text-anchor="middle">SCD1: мерчант, карта</text>
<text x="563.0" y="494" font-size="11.5" font-weight="400" fill="#333" text-anchor="middle">факт операций, даты</text>
<text x="563.0" y="510" font-size="11.5" font-weight="400" fill="#333" text-anchor="middle">6 правил → баллы</text>
<text x="675" y="438" font-size="1" font-weight="400" fill="#222" text-anchor="middle"></text>
<text x="668" y="442" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">allow &lt;30 · confirm 30–49 ·</text>
<text x="668" y="457" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">suspicious ≥50; ground_truth</text>
<text x="668" y="472" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">только в схеме eval</text>
<text x="668" y="520" font-size="11" font-weight="700" fill="#2a5caa" text-anchor="start"></text>
