<text x="563.0" y="358" font-size="11.5" font-weight="400" fill="#333" text-anchor="middle">ods_reject — брак</text>
<text x="563.0" y="374" font-size="11.5" font-weight="400" fill="#333" text-anchor="middle">ods_accounts — счета</text>
