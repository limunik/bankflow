<text x="857" y="672" font-size="14" font-weight="700" fill="#111" text-anchor="middle">Airflow — оркестратор · CeleryExecutor, 2 воркера · журнал stg.etl_load_log</text>
<text x="857" y="692" font-size="11.5" font-weight="400" fill="#333" text-anchor="middle">bankflow_pipeline: stg → ods → dds → флаги → проверки → bankflow_datamart: витрины → проверки → dbt/ClickHouse</text>
