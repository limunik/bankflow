<text x="95.0" y="235" font-size="11.5" font-weight="400" fill="#333" text-anchor="middle">wal_level=logical</text>
<text x="95.0" y="251" font-size="11.5" font-weight="400" fill="#333" text-anchor="middle">поток изменений</text>
