<text x="563" y="592" font-size="11" font-weight="400" fill="#333" text-anchor="middle">dm_transactions_daily</text>
<text x="563" y="606" font-size="11" font-weight="400" fill="#333" text-anchor="middle">dm_category_monthly</text>
<text x="668" y="566" font-size="11" font-weight="700" fill="#2a5caa" text-anchor="start">dq: 35 проверок как данные</text>
