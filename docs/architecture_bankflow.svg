<text x="668" y="322" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">брак &gt;5% → загрузка</text>
<text x="668" y="337" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">отменяется; счета по source_lsn</text>
<text x="668" y="380" font-size="11" font-weight="700" fill="#2a5caa" text-anchor="start"></text>
